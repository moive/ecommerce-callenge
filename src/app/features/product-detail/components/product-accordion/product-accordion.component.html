<section class="accordion" aria-label="Información adicional del producto">
  @for (item of items(); track item.id) {
    <div class="accordion__item">
      <button
        class="accordion__trigger"
        type="button"
        [attr.aria-expanded]="isOpen(item.id)"
        [attr.aria-controls]="'accordion-' + item.id"
        (click)="toggle(item.id)"
      >
        <span class="accordion__title">{{ item.title }}</span>
        <svg
          class="accordion__chevron"
          [class.accordion__chevron--open]="isOpen(item.id)"
          xmlns="http://www.w3.org/2000/svg"
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <polyline points="6 9 12 15 18 9" />
        </svg>
      </button>

      <div
        class="accordion__body"
        [class.accordion__body--open]="isOpen(item.id)"
        [id]="'accordion-' + item.id"
        role="region"
        [attr.aria-labelledby]="'accordion-trigger-' + item.id"
      >
        <div class="accordion__content" [innerHTML]="item.content"></div>
      </div>
    </div>
  }
</section>
