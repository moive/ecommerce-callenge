<section class="product-tabs" aria-labelledby="product-tabs-title">
  <!-- Label -->
  <h3 class="product-tabs__heading" id="product-tabs-title">
    {{ presentacion() }}:
    <span class="product-tabs__heading-value">
      {{ tabs().find(t => t.id === selectedId())?.label }}
    </span>
  </h3>

  <!-- Opciones -->
  <div class="product-tabs__list" role="radiogroup" aria-label="Seleccionar presentación">
    @for (tab of tabs(); track tab.id) {
      <label
        class="product-tabs__item"
        [class.product-tabs__item--selected]="isSelected(tab.id)"
        [attr.aria-checked]="isSelected(tab.id)"
      >
        <input
          class="product-tabs__radio"
          type="radio"
          name="product-tab"
          [value]="tab.id"
          [checked]="isSelected(tab.id)"
          (change)="selectTab(tab)"
        />

        <!-- Imagen -->
        <img
          class="product-tabs__img"
          [src]="tab.image"
          [alt]="tab.label"
          width="48"
          height="48"
          loading="lazy"
        />

        <!-- Info -->
        <div class="product-tabs__info">
          <span class="product-tabs__label">{{ tab.label }}</span>
          <span class="product-tabs__price">{{ tab.priceLabel }}</span>
        </div>

        <!-- Radio visual -->
        <span class="product-tabs__indicator" aria-hidden="true"></span>
      </label>
    }
  </div>
</section>
